name: Verify and publish game
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    name: verify (${{ matrix.suite }})
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        suite: [desktop, mobile, offline]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '23.11.0'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify geometry and rules
        if: matrix.suite == 'desktop'
        run: npm run test:ci
      - name: Rebuild the tested single-file artifact
        run: |
          cp site/artifact-manifest.json "$RUNNER_TEMP/expected-artifact.json"
          npm run build
          node scripts/check-artifact.mjs "$RUNNER_TEMP/expected-artifact.json"
      - name: Start isolated Codex test browser on port 9333
        run: |
          npx playwright install --with-deps chromium
          CHROME_TEST_BINARY=$(node --input-type=module -e "import {chromium} from 'playwright'; process.stdout.write(chromium.executablePath())")
          "$CHROME_TEST_BINARY" --headless=new --no-sandbox --use-angle=swiftshader --enable-unsafe-swiftshader --remote-debugging-address=127.0.0.1 --remote-debugging-port=9333 --user-data-dir="$RUNNER_TEMP/bean-frontier-codex-profile" > "$RUNNER_TEMP/chrome.log" 2>&1 &
          python3 -m http.server 5180 --bind 127.0.0.1 --directory site > "$RUNNER_TEMP/http.log" 2>&1 &
          for attempt in {1..30}; do
            if curl --silent --fail http://127.0.0.1:9333/json/version > /dev/null && curl --silent --fail http://127.0.0.1:5180/ > /dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Exercise built browser and offline artifact
        run: |
          case "${{ matrix.suite }}" in
            desktop) node scripts/v4-render-loop-browser.mjs && node scripts/v4-browser-verify.mjs && node scripts/v4-pose-browser.mjs ;;
            mobile) node scripts/v4-touch-guard-browser.mjs && node scripts/v4-mobile-browser.mjs && node scripts/v4-final-audit.mjs && node scripts/v4-map-browser.mjs && node scripts/v4-arsenal-browser.mjs && node scripts/v4-crouch-feedback-verify.mjs ;;
            offline) npm run test:offline ;;
          esac
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: game-verification-${{ matrix.suite }}
          path: output
  package:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
  deploy:
    needs: package
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish verified artifact
        id: deployment
        uses: actions/deploy-pages@v4
